<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Workspace controls</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="header-page">
  <header class="workspace-header d-flex align-items-center gap-2 px-3">
    <button class="btn btn-sm btn-outline-secondary" type="button" id="panel-back" hidden>‹ Back</button>
    <h1 id="workspace-title" class="workspace-title h5 mb-0 me-auto text-truncate"></h1>
    <span id="page-warning" class="text-warning small me-auto text-truncate" hidden></span>
    <div class="btn-group" id="actions" hidden>
      <button class="btn btn-sm btn-primary" type="button" id="primary"></button>
      <button class="btn btn-sm btn-primary dropdown-toggle dropdown-toggle-split" type="button" id="more" aria-label="More actions" aria-controls="panel" aria-expanded="false"></button>
    </div>
    <span class="workspace-status small d-flex align-items-center gap-2" id="rl-status-group" role="status">
      <span class="workspace-status-check" id="rl-status-check" aria-hidden="true" hidden></span>
      <span id="rl-status" class="text-truncate"></span>
    </span>
    <button class="btn btn-sm btn-outline-secondary header-icon" type="button" id="network" aria-label="Network" title="Network" aria-controls="panel" aria-expanded="false"><img src="/network-globe.svg" alt=""></button>
    <button class="btn btn-sm btn-outline-secondary header-icon" type="button" id="notifications" aria-label="Notifications" title="Notifications" aria-controls="panel" aria-expanded="false"><img src="/notification-bell.svg" alt=""><span id="unread" class="badge text-bg-primary" hidden></span></button>
  </header>
  <section class="header-panel" id="panel" hidden>
    <div class="d-flex justify-content-between align-items-center mb-2" id="panel-heading">
      <h1 class="h6 mb-0" id="panel-title"></h1>
      <button class="btn-close" type="button" aria-label="Close" id="close"></button>
    </div>
    <div id="panel-body"></div>
  </section>
  <script src="/header.js"></script>
</body>
</html>
