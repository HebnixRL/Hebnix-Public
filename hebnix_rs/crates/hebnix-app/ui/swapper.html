<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
  <title>Item Swapper</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container-fluid tracker-page swapper-page swapper-category-layout">
    <aside class="tracker-detail p-2 category-navigation" id="inventory">
      <select id="category" hidden></select>
      <nav id="category-navigation" class="category-navigation"></nav>
      <div class="item-browser-filters">
        <label><input class="form-check-input mt-0" type="checkbox" id="owned"> Show Owned Swappable Items</label>
        <label id="match-car-label"><input class="form-check-input mt-0" type="checkbox" id="match-car" checked> Match selected car</label>
      </div>
    </aside>
    <section class="tracker-detail" id="editor" hidden>
      <div class="card-body p-3 d-grid gap-3">
        <div class="d-flex align-items-center gap-2">
          <p class="text-body-secondary mb-0" id="catalog-status" role="status" hidden></p>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="reload" hidden>Reload catalogs</button>
        </div>
        <h2 class="h5 mb-0" id="category-title" hidden></h2>
        <div class="swapper-picker-banner" id="picker-banner"></div>
        <div id="car-fields" class="swapper-car-fields" hidden>
          <label for="car" class="form-label mb-0">Car</label><select class="form-select form-select-sm" id="car"></select>
        </div>
        <input class="form-control form-control-sm" type="search" id="source-search" placeholder="Search items to use" aria-label="Search items to use">
        <input class="form-control form-control-sm" type="search" id="target-search" placeholder="Search items to replace" aria-label="Search items to replace" hidden>
        <div class="swapper-grid" id="picker" role="group" aria-labelledby="picker-banner"></div>
        <p class="small text-body-secondary mb-0" id="picker-empty" hidden></p>
        <footer class="swapper-footer">
          <div class="swapper-footer-left">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="back" hidden>← Back</button>
            <div class="swapper-paint" id="paint-fields" hidden>
              <label for="paint">Paint</label><select class="form-select form-select-sm" id="paint"></select>
              <label id="custom-fields" hidden><span class="visually-hidden">Custom colour</span><input class="form-control form-control-color" type="color" id="custom" value="#ffffff"></label>
            </div>
            <div class="swapper-paint" id="speed-fields" hidden>
              <label for="speed">Speed</label><input class="form-control form-control-sm" id="speed" type="number" value="1" min="0" max="20" step=".25">
            </div>
          </div>
          <nav class="swapper-pages d-flex gap-2 align-items-center" id="picker-pages" aria-label="Item pages">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="prev-page">Previous</button>
            <span id="page-label" class="small text-nowrap"></span>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="next-page">Next</button>
          </nav>
          <div class="swapper-footer-right">
            <button type="button" class="btn btn-sm btn-primary" id="choose-replacement" disabled>Choose Replacement <span aria-hidden="true">→</span></button>
            <button type="button" class="btn btn-sm btn-primary" id="apply" hidden disabled>Apply <span aria-hidden="true">✓</span></button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="restore-all" hidden>Restore all</button>
          </div>
        </footer>
      </div>
    </section>
    <p id="status" class="mt-3" role="status" hidden></p>
    <div id="infinium-choice" class="mt-2" hidden>
      <button type="button" class="btn btn-sm btn-primary" id="infinium-bakkes">Use BakkesMod Infinium</button>
      <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="infinium-vanilla">Use vanilla Infinium</button>
    </div>
  </main>
  <script src="/swapper.js"></script>
</body>
</html>
