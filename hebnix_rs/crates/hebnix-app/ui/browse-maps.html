<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
  <title>Browse Maps</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="tracker-body">
  <main class="container-fluid tracker-page browse-maps-page">
    <section class="tracker-detail p-3 mb-3">
      <div class="d-flex flex-wrap gap-3 align-items-center">
        <input class="form-control flex-grow-1 maps-search" id="search" type="search">
        <label class="form-check-label d-flex gap-2 align-items-center">
          <input class="form-check-input mt-0" id="downloaded" type="checkbox">
          <span id="downloaded-label"></span>
        </label>
      </div>
    </section>
    <p class="text-body-secondary mb-3" id="count" role="status"></p>
    <div id="empty" class="tracker-detail p-3" hidden></div>
    <section class="maps-grid" id="maps" aria-label="Maps"></section>
    <nav id="map-pages" class="d-flex justify-content-center align-items-center gap-2 my-3" aria-label="Map pages">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="prev">Previous</button>
        <span class="small" id="page"></span>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="next">Next</button>
    </nav>
  </main>
  <div class="menu-lock" id="menu-warning" role="alertdialog" aria-modal="true" aria-labelledby="menu-lock-title" aria-describedby="menu-lock-body" hidden>
    <div class="menu-lock-card">
      <h2 class="h6" id="menu-lock-title"></h2>
      <p id="menu-lock-body"></p>
      <button type="button" class="btn btn-primary btn-sm" id="enable-menu"></button>
    </div>
  </div>
  <script src="/browse-maps.js"></script>
</body>
</html>
