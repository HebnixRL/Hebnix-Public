<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
  <title>Arena editor</title><link rel="stylesheet" href="/bootstrap.min.css"><link rel="stylesheet" href="/styles.css">
</head>
<body class="tracker-body">
  <main class="container-fluid tracker-page">
    <p class="text-body-secondary mb-3" id="map-instructions" hidden>Choose the map you want to play, then choose the arena it will replace entirely.</p>
    <div class="arena-columns">
      <section class="tracker-detail p-3">
        <h2 class="h6" id="donor-label">Background you want</h2>
        <input id="donor-search" class="form-control form-control-sm mb-3" type="search" placeholder="Search backgrounds" aria-label="Search backgrounds">
        <div class="arena-grid" id="donors" tabindex="0" role="region" aria-labelledby="donor-label"></div>
      </section>
      <section class="tracker-detail p-3">
        <h2 class="h6" id="host-label">Map to apply it to</h2>
        <input id="host-search" class="form-control form-control-sm mb-3" type="search" placeholder="Search maps" aria-label="Search maps">
        <div class="arena-grid" id="hosts" tabindex="0" role="region" aria-labelledby="host-label"></div>
      </section>
    </div>
    <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
      <button class="btn btn-sm btn-outline-secondary" id="refresh" type="button">Refresh</button>
      <button class="btn btn-sm btn-outline-secondary" id="folder" type="button">Background folder</button>
      <button class="btn btn-sm btn-outline-secondary" id="bulk" type="button">Apply to all unchanged maps</button>
      <button class="btn btn-sm btn-primary" id="apply" type="button" disabled>Apply</button>
    </div>
    <div class="tracker-detail p-3 mt-3" id="bulk-confirm" hidden>
      <p id="bulk-warning"></p><button type="button" class="btn btn-sm btn-primary me-2" id="bulk-apply">Apply to all unchanged maps</button><button type="button" class="btn btn-sm btn-outline-secondary" id="bulk-cancel">Cancel</button>
    </div>
    <p class="text-body-secondary mt-3" role="status" id="status"></p>
    <section class="tracker-detail p-3 mt-3" id="active" hidden>
      <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h6 mb-0">Active changes</h2><button type="button" class="btn btn-sm btn-outline-secondary" id="restore-all">Restore all</button></div>
      <div id="active-list"></div>
    </section>
  </main>
  <script src="/arena-editor.js"></script>
</body>
</html>
