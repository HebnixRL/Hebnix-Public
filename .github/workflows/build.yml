name: Build Hebnix

# manual only for now: go to the "Actions" tab on GitHub, pick this workflow,
# click "Run workflow". nothing runs automatically on push/PR.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hebnix_rs -> target

      - name: build hebnix
        run: cargo build --release --bin hebnix
        working-directory: hebnix_rs

      - name: build hebnix-lite
        run: cargo build --release --bin hebnix-lite --features lite
        working-directory: hebnix_rs

      - name: stage
        run: |
          $release = 'hebnix_rs\target\release'
          New-Item -ItemType Directory -Force -Path stage\hebnix, stage\hebnix-lite | Out-Null

          # steam_api64.dll is the eos steam auth, lite has no eos so it ships alone
          Copy-Item "$release\hebnix.exe"      stage\hebnix\
          Copy-Item 'hebnix_rs\vendor\steam_api64.dll' stage\hebnix\
          Copy-Item "$release\hebnix-lite.exe" stage\hebnix-lite\

          Get-ChildItem -Recurse stage | Select-Object FullName, Length
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-windows
          path: stage/hebnix/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-lite-windows
          path: stage/hebnix-lite/
          if-no-files-found: error
