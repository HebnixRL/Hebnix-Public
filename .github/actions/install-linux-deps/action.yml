name: Install Hebnix Linux build dependencies
description: >
  Installs the apt packages needed to build hebnix. Shared by build.yml and
  release.yml so the list can't drift between them.
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libgtk-3-dev \
          libayatana-appindicator3-dev libwayland-dev libxkbcommon-dev libudev-dev \
          libasound2-dev libssl-dev libxdo-dev libx11-dev libxtst-dev libxi-dev \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-layer-shell-dev \
          libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-shm0-dev libcap-dev
